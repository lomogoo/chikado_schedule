<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>チカ堂 スケジュール</title>
<meta name="description" content="チカ堂の施設利用スケジュール管理。月別ビューと3日間ビューで仮予約・本予約を管理します。" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>

<!-- ============ ヘッダー ============ -->
<header class="app-header">
  <div class="header-main">
    <a class="brand" href="./" aria-label="チカ堂 スケジュール">
      <img class="brand-logo" src="./assets/logo.svg" alt="チカ堂" />
      <span class="brand-text">
        <span class="brand-name">SCHEDULE</span>
        <span class="brand-sub">施設利用スケジュール</span>
      </span>
    </a>

    <div class="header-actions">
      <div class="seg" role="tablist" aria-label="表示切替">
        <button class="seg-btn is-active" role="tab" data-view="month" aria-selected="true">月</button>
        <button class="seg-btn" role="tab" data-view="three" aria-selected="false">3日間</button>
      </div>
      <button class="btn btn-primary" id="btn-new" type="button">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 1.5v13M1.5 8h13" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/></svg>
        <span>新規予約</span>
      </button>
    </div>
  </div>

  <div class="header-bar">
    <div class="nav-cluster">
      <button class="icon-btn" id="btn-prev" type="button" aria-label="前へ">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M10 2 4 8l6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="icon-btn" id="btn-next" type="button" aria-label="次へ">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M6 2l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="btn btn-ghost" id="btn-today" type="button">今日</button>
      <h1 class="period" id="period-label">—</h1>
    </div>

    <div class="filter-cluster">
      <button class="chip-filter is-active" data-filter="all" type="button">すべて</button>
      <button class="chip-filter" data-filter="confirmed" type="button"><i class="dot dot-confirmed"></i>本予約</button>
      <button class="chip-filter" data-filter="tentative" type="button"><i class="dot dot-tentative"></i>仮予約</button>
    </div>
  </div>
</header>

<!-- ============ 本体 ============ -->
<main class="app-main">
  <section id="view-month" class="view"></section>
  <section id="view-three" class="view" hidden></section>

  <div class="loading-bar" id="loading-bar" hidden></div>
</main>

<!-- ============ 予約フォーム ============ -->
<div class="overlay" id="overlay-form" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="form-title">
    <div class="sheet-head">
      <h2 class="sheet-title" id="form-title">新規予約</h2>
      <button class="icon-btn icon-btn-plain" id="form-close" type="button" aria-label="閉じる">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>

    <form class="sheet-body" id="reservation-form" novalidate>
      <input type="hidden" name="id" />

      <div class="field">
        <span class="label">予約区分</span>
        <div class="status-pick">
          <label class="status-opt status-opt-tentative">
            <input type="radio" name="status" value="tentative" checked />
            <span class="status-box">
              <b>仮予約</b>
              <small>未確定・仮押さえ</small>
            </span>
          </label>
          <label class="status-opt status-opt-confirmed">
            <input type="radio" name="status" value="confirmed" />
            <span class="status-box">
              <b>本予約</b>
              <small>確定</small>
            </span>
          </label>
        </div>
      </div>

      <label class="field">
        <span class="label">件名 <i class="req">必須</i></span>
        <input class="input" type="text" name="title" maxlength="80" placeholder="例）m chika. 試験営業" required />
      </label>

      <div class="field-row">
        <label class="field">
          <span class="label">利用日 <i class="req">必須</i></span>
          <input class="input" type="date" name="date" required />
        </label>
        <label class="field field-narrow">
          <span class="label">人数</span>
          <input class="input" type="number" name="headcount" min="0" max="9999" placeholder="—" />
        </label>
      </div>

      <div class="field">
        <span class="label">利用時間 <i class="req">必須</i><small class="hint">30分単位</small></span>
        <div class="time-row">
          <select class="input select" name="start_time" required></select>
          <span class="time-sep">→</span>
          <select class="input select" name="end_time" required></select>
        </div>
        <div class="duration" id="duration-label"></div>
      </div>

      <label class="field">
        <span class="label">利用内容 <i class="req">必須</i></span>
        <textarea class="input textarea" name="purpose" rows="3" maxlength="1000" placeholder="例）飲食提供（サンドイッチ・蒸し牡蠣）＋物販。搬入 14:00 / 撤収 22:30。" required></textarea>
      </label>

      <div class="field-row">
        <label class="field">
          <span class="label">利用者・団体名</span>
          <input class="input" type="text" name="organizer" maxlength="80" placeholder="例）チカ堂プロジェクト" />
        </label>
        <label class="field">
          <span class="label">連絡先</span>
          <input class="input" type="text" name="contact" maxlength="120" placeholder="電話 / メール" />
        </label>
      </div>

      <label class="field">
        <span class="label">備考</span>
        <textarea class="input textarea" name="notes" rows="2" maxlength="1000" placeholder="設営や備品などの申し送り"></textarea>
      </label>

      <div class="form-alert" id="form-alert" hidden></div>
    </form>

    <div class="sheet-foot">
      <button class="btn btn-danger-ghost" id="form-delete" type="button" hidden>削除</button>
      <div class="spacer"></div>
      <button class="btn btn-ghost" id="form-cancel" type="button">キャンセル</button>
      <button class="btn btn-primary" id="form-submit" type="button">保存</button>
    </div>
  </div>
</div>

<!-- ============ 予約詳細 ============ -->
<div class="overlay" id="overlay-detail" hidden>
  <div class="sheet sheet-narrow" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <div class="sheet-head">
      <h2 class="sheet-title" id="detail-title">予約詳細</h2>
      <button class="icon-btn icon-btn-plain" id="detail-close" type="button" aria-label="閉じる">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="detail-body"></div>
    <div class="sheet-foot">
      <button class="btn btn-danger-ghost" id="detail-delete" type="button">削除</button>
      <div class="spacer"></div>
      <button class="btn btn-ghost" id="detail-confirm" type="button" hidden>本予約に確定</button>
      <button class="btn btn-primary" id="detail-edit" type="button">編集</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap" aria-live="polite"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
